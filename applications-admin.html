<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Recruitment Admin | Echo.TGPCOP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bowlby+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="echo.css"><style>
.admin-top{padding:70px 0 24px}.admin-top h1{font-size:clamp(3rem,8vw,5.5rem);margin:0}.admin-tools{display:grid;grid-template-columns:1fr;gap:12px;margin:20px 0}.admin-tools input,.admin-tools select,.admin-card textarea,.admin-card select{width:100%;border:2px solid #ffffff70;border-radius:12px;background:#fff;color:#001c78;padding:12px;font:500 14px Poppins,sans-serif}.app-list{display:grid;gap:16px}.admin-card{padding:22px;background:#002daacc;border:1px solid #ffffff65;border-radius:18px;overflow-wrap:anywhere}.admin-card h3{margin:0 0 6px}.admin-card p{margin:6px 0}.admin-card details{margin:12px 0}.admin-card summary{cursor:pointer;color:#FFD60A;font-weight:700}.admin-card pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px Poppins,sans-serif}.admin-actions{display:grid;grid-template-columns:1fr;gap:10px}.admin-message{padding:18px;border-radius:14px;background:#002daacc}.notes{min-height:88px}@media(min-width:650px){.admin-tools{grid-template-columns:2fr 1fr 1fr 1fr}.admin-actions{grid-template-columns:1fr 2fr auto;align-items:center}}
</style></head><body><div id="nav"></div><header class="admin-top"><div class="wrap"><span class="pill">PRIVATE • ECHO.TGPCOP</span><h1>Recruitment <span class="y">Desk</span></h1><p>Private application dashboard for the authorized Google account.</p></div></header><section><div class="wrap"><div id="gate" class="admin-message" role="status">Checking access…</div><div id="dashboard" hidden><div class="admin-tools"><input id="search" type="search" placeholder="Search name or email" aria-label="Search name or email"><select id="dept"><option value="">All departments</option></select><select id="level"><option value="">All experience levels</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Professional</option></select><button class="btn" id="export">Export CSV</button></div><p id="count"></p><div class="app-list" id="applications"></div></div></div></section><div id="foot"></div><script src="env.js"></script><script src="echo.js"></script><script>
const STATUS=['pending','under_review','shortlisted','selected','rejected'];const DEPTS=['Photography','Videography','Video Editing','Reels & Content Creation','Cinematography','Graphic Designing','Poster & Banner Designing','Social Media Management','Content Writing','Script Writing','Anchoring / Hosting','Public Relations','Event Management','Event Coordination','Marketing & Promotions','Sponsorship & Outreach','Website / Technology','Other'];
const escHTML=s=>esc(String(s??''));const deptSelect=$('#dept');DEPTS.forEach(d=>deptSelect.add(new Option(d,d)));let rows=[];
function gate(text){$('#gate').textContent=text}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportCsv(){const cols=['id','created_at','full_name','email','phone','college','course','academic_year','departments','skills','experience_level','weekly_availability','preferred_role','status','admin_notes'];const lines=[cols.join(','),...filtered().map(r=>cols.map(k=>csvCell(Array.isArray(r[k])?r[k].join('; '):r[k])).join(','))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='echo-team-applications.csv';a.click();URL.revokeObjectURL(a.href)}
function filtered(){const q=$('#search').value.trim().toLowerCase(),d=deptSelect.value,l=$('#level').value;return rows.filter(r=>(!q||r.full_name.toLowerCase().includes(q)||r.email.toLowerCase().includes(q))&&(!d||r.departments.includes(d))&&(!l||r.experience_level===l))}
function detailsText(r){const safe={...r};delete safe.admin_notes;return JSON.stringify(safe,null,2)}
function render(){const list=filtered();$('#count').textContent=list.length+' application'+(list.length===1?'':'s');$('#applications').innerHTML=list.map(r=>`<article class="admin-card" data-id="${escHTML(r.id)}"><h3>${escHTML(r.full_name)}</h3><p><a class="y" href="mailto:${encodeURIComponent(r.email)}">${escHTML(r.email)}</a> • ${escHTML(r.phone)}</p><p>${escHTML(r.college)}${r.course?' • '+escHTML(r.course):''} • ${escHTML((r.departments||[]).join(', '))}</p><p class="muted">${escHTML(new Date(r.created_at).toLocaleString())} • ${escHTML(r.experience_level||'Experience not specified')}</p><details><summary>View full application</summary><pre>${escHTML(detailsText(r))}</pre>${r.profile_photo_path?'<button type="button" class="btn o photo" data-path="'+escHTML(r.profile_photo_path)+'">Open private profile photo</button>':''}</details><div class="admin-actions"><select class="status" aria-label="Application status">${STATUS.map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select><textarea class="notes" maxlength="4000" aria-label="Internal notes" placeholder="Internal admin notes">${escHTML(r.admin_notes||'')}</textarea><button type="button" class="btn save">Save review</button></div><small class="save-state" aria-live="polite"></small></article>`).join('')||'<p class="admin-message">No applications match these filters.</p>';rv($('#applications'))}
async function load(){gate('Loading applications…');const{data,error,count:total}=await getSB().from('echo_team_applications').select('*',{count:'exact'}).order('created_at',{ascending:false}).limit(1000);if(error){gate('Could not load applications. Apply the latest recruitment.sql in Supabase SQL Editor, then reload this page.');console.warn(error.message);return}rows=data||[];$('#gate').hidden=true;$('#dashboard').hidden=false;render();if(total>rows.length)$('#count').textContent+=` (showing latest ${rows.length} of ${total} total)`}
async function initAdmin(){await ready;if(!getSB()){gate('Supabase is not configured for this site.');return}if(!window.USER){gate('Sign in with Google account sb108750@gmail.com to view applications.');const a=document.createElement('button');a.className='btn';a.textContent='Sign in with Google';a.onclick=()=>getSB()?.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});$('#gate').append(' ',a);return}if(String(window.USER.email||'').toLowerCase()!=='sb108750@gmail.com'){gate('Access denied. Sign in with the authorized Google account sb108750@gmail.com.');return}await load()}
$('#search').addEventListener('input',render);$('#dept').addEventListener('change',render);$('#level').addEventListener('change',render);$('#export').addEventListener('click',exportCsv);
$('#applications').addEventListener('click',async e=>{const card=e.target.closest('.admin-card');if(!card)return;const row=rows.find(x=>x.id===card.dataset.id);if(e.target.classList.contains('photo')){const{data,error}=await getSB().storage.from('team-applications').createSignedUrl(e.target.dataset.path,60);if(error){card.querySelector('.save-state').textContent='Could not open image.';return}window.open(data.signedUrl,'_blank','noopener');return}if(e.target.classList.contains('save')){e.target.disabled=true;const status=card.querySelector('.status').value,admin_notes=card.querySelector('.notes').value;const{error}=await getSB().from('echo_team_applications').update({status,admin_notes}).eq('id',row.id);card.querySelector('.save-state').textContent=error?'Save failed. Please retry.':'Review saved.';if(!error){row.status=status;row.admin_notes=admin_notes}e.target.disabled=false}});
initAdmin();</script></body></html>
