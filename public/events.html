<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Events | Echo.TGPCOP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bowlby+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="echo.css"></head><body><div id="nav"></div>
<div data-shatter data-title="Echo<br><span class='y'>Events</span>" data-sub="Upcoming event details and registration links."></div>
<section><div class="wrap"><h2 class="rv">Upcoming <span class="y">Events</span></h2><p id="cd-label" class="rv">Registration closes in</p><div class="cd rv" id="cd"></div><div class="cols" id="up"></div></div></section>
<div id="foot"></div><script src="env.js"></script>
<script src="echo.js"></script>
<script>
const UP=[{t:'Echo Sing-Off | Online Singing Competition',d:'2026-11-10T23:59:59+05:30',p:'Online (Instagram reel)',x:'Sing a 30-60 sec reel, tag @echo.tgpcop and win 3 months Spotify Premium + 1 month Netflix.',pill:'Free entry till 10 Nov • Results 15 Nov'}];
const e=UP[0],box=$('#cd');
function tick(){const ms=new Date(e.d)-Date.now();if(ms<=0){box.innerHTML='<span class="pill">Registration closed</span>';$('#cd-label').textContent='';return}
 const s=Math.floor(ms/1e3),v=[['Days',Math.floor(s/86400)],['Hours',Math.floor(s%86400/3600)],['Mins',Math.floor(s%3600/60)],['Secs',s%60]];
 box.innerHTML=v.map(a=>'<div><b>'+String(a[1]).padStart(2,'0')+'</b><small>'+a[0]+'</small></div>').join('')}
tick();setInterval(tick,1000);
$('#up').innerHTML=UP.map(u=>'<div class="card tilt rv"><div class="bd"><span class="pill">'+esc(u.pill)+'</span><h3 style="margin-top:12px">'+esc(u.t)+'</h3><p>📍 '+esc(u.p)+'</p><p>'+esc(u.x)+'</p><p style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><a class="btn" href="singoff.html#register">Register Free</a><a class="btn o" href="https://konfhub.com/echo-sing-off-online-singing-competition" target="_blank" rel="noopener">Direct link</a></p></div></div>').join('');
rv();
</script></body></html>
